[project]
name = "cutgen-agent"
version = "0.1.0"
description = "Loop de performance -> aprendizado: collect (coleta metricas) -> store (persiste) -> significance (mede evidencia) -> promote (atualiza knowledge/). Construcao nova: o GTclips real ainda faz isso manualmente via /consolidate."
requires-python = ">=3.11"
dependencies = [
    "cutgen-shared",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutgen_agent"]
