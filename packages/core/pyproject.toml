[project]
name = "cutgen-core"
version = "0.1.0"
description = "Pipeline generico ingest/transcribe/select/write/render/publish, configuravel por niches/<niche>/config.yaml."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutgen_core"]
