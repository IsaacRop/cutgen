[project]
name = "cutgen-knowledge"
version = "0.1.0"
description = "Agentes analyst/curator/selector/writer — mesmo prompt, dois jeitos de rodar: skill do Claude Code ou chamada LLM propria."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutgen_knowledge"]
