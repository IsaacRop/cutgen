name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-packages --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check packages/

      - name: Test (pytest)
        run: uv run pytest packages/shared/tests packages/knowledge/tests packages/core/tests packages/agent/tests
